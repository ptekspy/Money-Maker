name: Deploy LetDue manually

on:
  workflow_dispatch:
    inputs:
      stage:
        description: SST stage to deploy
        required: true
        default: dellpatri
      confirm_domain:
        description: Type letdue.com to confirm this deploy targets LetDue
        required: true
        default: letdue.com
      mode:
        description: Plan the infrastructure diff or deploy it
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy

permissions:
  id-token: write
  contents: read

concurrency:
  group: letdue-manual-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_domain == 'letdue.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check LetDue web app
        run: npm run check -- --filter=@certcue/web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Show infrastructure changes
        run: npm exec sst diff -- --stage "${{ inputs.stage }}"

      - name: Deploy LetDue
        if: ${{ inputs.mode == 'deploy' }}
        run: npm run deploy:aws -- --stage "${{ inputs.stage }}"
